name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: API + inference tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # downloads the real ONNX models so the real-model tests run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check the model files are real (not Git LFS pointers)
        run: |
          for f in apps/inference/weights/*.onnx; do
            if head -c 20 "$f" | grep -q "version https://git"; then echo "::error::$f is a Git LFS pointer"; exit 1; fi
          done
      - run: pip install -r apps/api/requirements-dev.txt -r apps/inference/requirements.txt
      - run: python -m pytest tests -q

  mysql-migrations:
    name: Migrations on MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: agrisense_test
          MYSQL_USER: agrisense
          MYSQL_PASSWORD: agrisense
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      ENV: test
      DATABASE_URL: mysql+pymysql://agrisense:agrisense@127.0.0.1:3306/agrisense_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r apps/api/requirements.txt
      - name: Migrate a clean database
        run: alembic -c apps/api/alembic.ini upgrade head
      - name: Seed
        run: python -m apps.api.db.seed
      - name: Migrate down and up again
        run: |
          alembic -c apps/api/alembic.ini downgrade base
          alembic -c apps/api/alembic.ini upgrade head

  web:
    name: Web type-check, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: cp apps/api/.env.example apps/api/.env
      - run: docker compose -f infra/docker-compose.yml build
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
